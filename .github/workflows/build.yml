name: Build

on:
  schedule:
    - cron: '38 * * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: |
          SHA_VALUE="${{ github.sha }}"
          ACTION_VALUE="${{ github.job }}"
          TIME_VALUE=$(date +'%F %T %z')
          sed -i "s/SHA/${SHA_VALUE}/g" output/index.html
          sed -i "s/ACTION/${ACTION_VALUE}/g" output/index.html
          sed -i "s/TIME/${TIME_VALUE}/g" output/index.html
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output
      - uses: actions/deploy-pages@v4
